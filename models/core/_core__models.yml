version: 2

models:
  - name: dim_deal
    description: One row per accepted deal, pivoted from the change log. The business view of a deal.
    meta:
      layer: core
      grain: one row per accepted deal
      primary_key: [deal_id]
    columns:
      - name: deal_id
        description: Pipedrive deal ID.
        data_type: integer
        data_tests: [not_null, unique]
      - name: deal_created_at
        description: When the deal was created.
        data_type: timestamp
        data_tests: [not_null]
      - name: first_stage_entered_at
        description: When the first stage row was recorded.
        data_type: timestamp
      - name: current_stage_id
        description: Last stage entered. Sets the deal's position, not where it ended up.
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stage')
                field: stage_id
      - name: max_stage_id
        description: Furthest stage reached.
        data_type: integer
      - name: owner_user_id
        description: Latest owner, from `dim_deal_owner`.
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: deal_status
        description: open or lost. Derived, because the extract has no deal status, only lost reasons.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [open, lost]
      - name: lost_at
        description: Time of the earliest lost reason, standing in for the loss time.
        data_type: timestamp
      - name: lost_reason_id
        description: Lost reason code.
        data_type: integer
      - name: lost_reason
        description: Lost reason label.
        data_type: text

  - name: dim_deal_owner
    description: >
      One row per accepted deal and period of ownership, built from the change log. A type 2 history: it answers
      who owned a deal at any time. Periods include `valid_from` and exclude `valid_to`. Before its first owner row,
      a deal has no recorded owner.
    meta:
      layer: core
      grain: one row per accepted deal and ownership period
      primary_key: [deal_id, valid_from]
    data_tests:
      - unique_combination:
          arguments:
            columns: [deal_id, valid_from]
    columns:
      - name: deal_id
        description: Pipedrive deal ID.
        data_type: integer
        data_tests: [not_null]
      - name: owner_user_id
        description: Owner in this period.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: valid_from
        description: When this owner was recorded.
        data_type: timestamp
        data_tests: [not_null]
      - name: valid_to
        description: When the next owner was recorded. Empty for the current owner.
        data_type: timestamp
      - name: is_current
        description: True for the deal's latest owner.
        data_type: boolean
        data_tests: [not_null]

  - name: dim_user
    description: One row per user, without emails. Reads as staff, since users fill the Owner field.
    meta:
      layer: core
      grain: one row per user
      primary_key: [user_id]
    columns:
      - name: user_id
        description: User ID.
        data_type: integer
        data_tests: [not_null, unique]
      - name: user_name
        description: User's name.
        data_type: text
      - name: has_shared_email
        description: True when another user has the same email. A flag only.
        data_type: boolean
        data_tests: [not_null]
      - name: modified_at
        description: When the user record last changed.
        data_type: timestamp

  - name: dim_stage
    description: One row per pipeline stage, with the required label from the seed.
    meta:
      layer: core
      grain: one row per stage
      primary_key: [stage_id]
    columns:
      - name: stage_id
        description: Stage ID.
        data_type: integer
        data_tests: [not_null, unique]
      - name: source_stage_name
        description: Stage name, in the source's spelling.
        data_type: text
      - name: kpi_name
        description: Required stage name.
        data_type: text
        data_tests: [not_null]

  - name: dim_activity_type
    description: One row per activity type, marking the two sales calls.
    meta:
      layer: core
      grain: one row per activity type
      primary_key: [activity_type]
    columns:
      - name: activity_type
        description: Activity type code, such as `meeting`.
        data_type: text
        data_tests: [not_null, unique]
      - name: activity_type_name
        description: Activity type name, such as Sales Call 1.
        data_type: text
      - name: is_active
        description: Whether the type is active in the source. Not used to filter calls.
        data_type: boolean
      - name: is_sales_call
        description: True when the type's name is a step in the funnel.
        data_type: boolean
        data_tests: [not_null]

  - name: dim_month
    description: >
      One row per reporting month, from the first to the last month with a stage row or an activity.
      Reads ods_, so losing all accepted data can't shrink the calendar and hide the loss.
    meta:
      layer: core
      grain: one row per month
      primary_key: [month]
    columns:
      - name: month
        description: First day of the month.
        data_type: date
        data_tests: [not_null, unique]
      - name: month_end
        description: Last day of the month.
        data_type: date
        data_tests: [not_null]

  - name: fct_deal_change
    description: >
      Every row of the deal change log, with `dq_reason`. Broken deal identity is flagged here, in one
      place. Downstream models read `dq_reason is null`.
    meta:
      layer: core
      fact_type: transaction
      grain: one row per deal field change, all rows
      primary_key: [deal_id, changed_field, changed_at, new_value]
    data_tests:
      - unique_combination:
          arguments:
            columns: [deal_id, changed_field, changed_at, new_value]
    columns:
      - name: deal_id
        description: Pipedrive deal ID.
        data_type: integer
        data_tests: [not_null]
      - name: changed_field
        description: The field that changed.
        data_type: text
        data_tests: [not_null]
      - name: changed_at
        description: When the field changed.
        data_type: timestamp
        data_tests: [not_null]
      - name: new_value
        description: The field's value after the change, as text.
        data_type: text
      - name: dq_reason
        description: Why the row is kept out of accepted data. Null means accepted.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [multiple_deal_creations]

  - name: fct_activity
    description: >
      Every activity, with `dq_reason`. Broken activity IDs are flagged here, in one place. Has no key,
      because flagged IDs repeat.
    meta:
      layer: core
      fact_type: transaction
      grain: one row per activity row, all rows
    columns:
      - name: activity_id
        description: Pipedrive activity ID.
        data_type: integer
        data_tests: [not_null]
      - name: activity_type
        description: Activity type code. Checked against `activity_types` in `rep_data_quality_checks`.
        data_type: text
        data_tests: [not_null]
      - name: assigned_user_id
        description: User assigned to the activity.
        data_type: integer
      - name: deal_id
        description: Deal ID on the activity.
        data_type: integer
        data_tests: [not_null]
      - name: is_done
        description: Whether the activity is marked as done.
        data_type: boolean
        data_tests: [not_null]
      - name: due_at
        description: Scheduled due time.
        data_type: timestamp
        data_tests: [not_null]
      - name: due_month
        description: First day of the month of the due time. A call's month in the report.
        data_type: date
        data_tests: [not_null]
      - name: has_deal_history
        description: True when the deal ID appears in `dim_deal`. Information only, not a rule.
        data_type: boolean
        data_tests: [not_null]
      - name: dq_reason
        description: Why the row is kept out of accepted data. Null means accepted.
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [duplicate_activity_id]

  - name: fct_deal_stage_entry
    description: >
      One row each time a deal enters a stage. A forward move also enters every stage it skipped, so a
      deal going from 2 to 5 gets rows for 3, 4 and 5. Accepted data only.
    meta:
      layer: core
      fact_type: transaction
      grain: one row per deal, stage and entry
      primary_key: [deal_id, stage_id, entered_at]
    data_tests:
      - unique_combination:
          arguments:
            columns: [deal_id, stage_id, entered_at]
    columns:
      - name: deal_id
        description: Pipedrive deal ID.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_deal')
                field: deal_id
      - name: stage_id
        description: Stage entered.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stage')
                field: stage_id
      - name: entered_at
        description: Time of the stage change. A skipped stage takes the time of the move that passed it.
        data_type: timestamp
        data_tests: [not_null]
      - name: entered_month
        description: First day of the month of entry.
        data_type: date
        data_tests: [not_null]
      - name: is_skipped_stage
        description: True when the deal passed this stage without a row of its own.
        data_type: boolean
        data_tests: [not_null]

  - name: fct_deal_stage_month_end
    description: >
      Where each open deal sits at each month end. Estimated: a deal is open until it gets a lost reason.
      Skipped stages are passed, never held.
    meta:
      layer: core
      fact_type: periodic snapshot
      grain: one row per open deal and month end
      primary_key: [deal_id, month]
    data_tests:
      - unique_combination:
          arguments:
            columns: [deal_id, month]
    columns:
      - name: deal_id
        description: Pipedrive deal ID.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_deal')
                field: deal_id
      - name: month
        description: First day of the month.
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_month')
                field: month
      - name: stage_id
        description: Last recorded stage at month end.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stage')
                field: stage_id
