version: 2

models:
  - name: ods_pipedrive__deal_changes
    description: Typed log of deal field changes, one row per recorded change, after exact-row dedup.
    meta:
      layer: ods
      grain: one row per recorded field change
    data_tests:
      - unique_combination:
          arguments:
            columns: [deal_id, changed_field, changed_at, new_value]
    columns:
      - name: deal_id
        description: Pipedrive deal ID.
      - name: changed_at
        description: When the field changed.
      - name: changed_field
        description: The field that changed. One of add_time, user_id, stage_id, lost_reason.
      - name: new_value
        description: The field's value after the change, as text.

  - name: ods_pipedrive__activity
    description: Typed activities after exact-row dedup. `activity_id` still repeats across differing rows.
    meta:
      layer: ods
      grain: one row per distinct activity row
    data_tests:
      - unique_combination:
          arguments:
            columns: [activity_id, activity_type, assigned_user_id, deal_id, is_done, due_at]
    columns:
      - name: activity_id
        description: Pipedrive activity ID.
      - name: activity_type
        description: Activity type code, such as `meeting`.
      - name: assigned_user_id
        description: User assigned to the activity.
      - name: deal_id
        description: Deal ID on the activity.
      - name: is_done
        description: Whether the activity is marked as done.
      - name: due_at
        description: Scheduled due time.

  - name: ods_pipedrive__users
    description: Typed users. The only model that exposes emails. Holds personal data.
    meta:
      layer: ods
      grain: one row per user
      primary_key: [user_id]
    columns:
      - name: user_id
        description: User ID.
        data_tests: [unique]
      - name: user_name
        description: User's name.
      - name: email
        description: User's email.
      - name: modified_at
        description: When the user record last changed.

  - name: ods_pipedrive__stages
    description: Typed pipeline stages, in the source's spelling.
    meta:
      layer: ods
      grain: one row per stage
      primary_key: [stage_id]
    columns:
      - name: stage_id
        description: Stage ID.
        data_tests: [unique]
      - name: stage_name
        description: Stage name, in the source's spelling.

  - name: ods_pipedrive__activity_types
    description: Typed activity types. The source's own link between codes and names.
    meta:
      layer: ods
      grain: one row per activity type
      primary_key: [activity_type_id]
    columns:
      - name: activity_type_id
        description: Activity type ID.
        data_tests: [unique]
      - name: activity_type_name
        description: Activity type name, such as Sales Call 1.
      - name: is_active
        description: Whether the type is active in the source.
      - name: activity_type
        description: Activity type code, such as `meeting`.

  - name: ods_pipedrive__fields
    description: Typed deal fields, the source of lost reason labels.
    meta:
      layer: ods
      grain: one row per field
      primary_key: [field_id]
    columns:
      - name: field_id
        description: Field ID.
        data_tests: [unique]
      - name: field_key
        description: Field key, as used in `deal_changes`.
      - name: field_name
        description: Field label.
      - name: field_value_options
        description: Coded values and their labels.
