        - *pass_sales_call_acceptance_rate
        - *pass_accepted_plus_review_balances
        - *pass_accepted_data_in_every_month
        - *pass_funnel_steps_complete
        - *pass_stage_steps_reconcile
        - *pass_call_steps_reconcile
        - *pass_unmapped_stage
