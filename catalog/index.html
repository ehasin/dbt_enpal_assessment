<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#072543" />
    <meta
      name="description"
      content="Find Enpal's Data Products and Reports, see what each one is for, and request access."
    />
    <title>Data Product Catalog · Enpal</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="storefront.css" />
    <script defer src="snapshot.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-action="skip">Skip to content</a>
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Enpal data catalog home"
        >Enpal<span>.</span><span class="brand-divider"></span
        ><span class="brand-label"
          >data<span class="brand-label-sub">PRODUCT CATALOG</span></span
        ></a
      >
      <div class="header-actions">
        <button
          class="search-trigger"
          data-action="search"
          aria-label="Search the catalog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 5 5" /></svg
          ><span>Find data</span><kbd>/</kbd>
        </button>
        <a
          href="#/request"
          class="request-bag"
          aria-label="Access request basket"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14l1 14H4L5 7zM8 8V6a4 4 0 0 1 8 0v2" /></svg
          ><span id="bag-count">0</span></a
        >
        <button
          class="icon-button menu-button"
          data-action="menu"
          aria-label="Open navigation"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </header>
    <div class="layout">
      <aside
        id="sidebar"
        class="sidebar"
        aria-label="Catalog navigation"
      ></aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript
      ><div class="noscript">
        Enable JavaScript to use this catalog.
      </div></noscript
    >
  </body>
</html>
