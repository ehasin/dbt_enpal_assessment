name: 'enpal_assessment_project'
version: '1.0.0'

profile: 'enpal_assessment_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Lowest share of source rows that must survive into accepted data before reports publish.
  min_stage_row_acceptance_rate: 0.95
  min_sales_call_acceptance_rate: 0.95

models:
  enpal_assessment_project:
    ods:
      +schema: pipedrive_ods
      +materialized: view
    core:
      +schema: pipedrive_core
      +materialized: table
      +contract:
        enforced: true
    reporting:
      +schema: pipedrive_analytics
      +materialized: table
      +contract:
        enforced: true

seeds:
  enpal_assessment_project:
    +schema: pipedrive_core

data_tests:
  enpal_assessment_project:
    reporting:
      # Keeps the failing rows, so a failure names the month and the step.
      +store_failures: true
      +schema: pipedrive_audit
